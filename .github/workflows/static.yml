# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # 定时同步仓库展示数据、预览图，以及演示厅（都给到最迟 1 小时）
  schedule:
    - cron: "0 * * * *"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 生成仓库展示数据与预览图（只进部署工件，不产生 git 提交）
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Generate repos showcase data
        run: |
          pip install pillow
          python .github/scripts/build_repos.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 演示厅（https://github.com/ABitGinger/WebDemos）的源码在那个仓库，
      # /demo/ 由这里在构建时同步生成，同样只进部署工件、不产生 git 提交。
      # 每个演示的独立地址是 /demo/demos/<slug>/，由仓库里的目录结构自动决定。
      - name: Sync demos from WebDemos
        run: |
          set -uo pipefail
          rm -rf .tmp-webdemos demo
          ok=0
          for i in 1 2 3; do
            if git clone --depth=1 --quiet https://github.com/ABitGinger/WebDemos.git .tmp-webdemos; then
              ok=1
              break
            fi
            echo "第 ${i} 次 clone 失败，2 秒后重试…"
            rm -rf .tmp-webdemos
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "::warning title=演示厅同步失败::WebDemos 拉取失败，本次构建跳过 /demo/，站点其余部分照常发布。"
            exit 0
          fi
          mkdir -p demo
          cp -r .tmp-webdemos/index.html \
                .tmp-webdemos/demos.json \
                .tmp-webdemos/assets \
                .tmp-webdemos/demos \
                demo/
          rm -rf .tmp-webdemos
          echo "已同步演示厅：$(find demo -type f | wc -l) 个文件"
          ls -1 demo

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository or specify a subdirectory if needed
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
